name: Refresh NHL ATG odds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-odds
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run odds refresh
        env:
          OPTIC_ODDS_API_KEY: ${{ secrets.OPTIC_ODDS_API_KEY }}
        run: python refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "nhl-atg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Refresh live odds [skip ci]"
          git push

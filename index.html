  /* ─── DATA LAYER ──────────────────────────────── */
  var DATA = null;

  async function loadData() {
    /* Try db first */
    try {
      var db = await window.claude.use('db');
      if (db) {
        var doc = await db.doc('data/current_slate').get();
        if (doc && doc.players && doc.players.length > 0) {
          DATA = doc;
          return;
        }
      }
    } catch(e) { /* db not available or no data */ }

    /* Try Google Sheets via MCP */
    try {
      var mcp = await window.claude.use('mcp');
      if (mcp) {
        var tools = await mcp.listTools();
        var hasDrive = tools.some(function(t) { return t.server === 'Google Drive'; });
        if (hasDrive) {
          /* Read from the NHL ATG Daily Output sheet */
          var drive = await mcp.server('Google Drive');
          var result = await drive.search_files({query: "name = 'NHL ATG Daily Output'"});
          if (result && result.files && result.files.length > 0) {
            var content = await drive.read_file_content({fileId: result.files[0].id});
            if (content) {
              DATA = JSON.parse(content);
              /* Cache in db */
              try {
                var db2 = await window.claude.use('db');
                if (db2) await db2.doc('data/current_slate').set(DATA);
              } catch(e2) {}
              return;
            }
          }
        }
      }
    } catch(e) { /* MCP not available */ }

    /* Fallback: use seed data */
    DATA = SEED_DATA;

    /* Try to cache seed in db */
    try {
      var db3 = await window.claude.use('db');
      if (db3) await db3.doc('data/current_slate').set(DATA);
    } catch(e3) {}
  }

  /* ─── RENDERING ───────────────────────────────── */
  function fairStr(fo) {
    if (fo === null || fo === undefined || isNaN(fo)) return 'N/A';
    return fo > 0 ? '+' + Math.round(fo) : '' + Math.round(fo);
  }

  function starsHtml(atg) {
    var c = atg >= 35 ? 5 : atg >= 28 ? 4 : atg >= 22 ? 3 : atg >= 16 ? 2 : atg >= 10 ? 1 : 0;
    var on = '<span class="do-nhlatg-star do-star-on">&#9733;</span>';
    var off = '<span class="do-nhlatg-star do-star-off">&#9733;</span>';
    return on.repeat(c) + off.repeat(5 - c);
  }

  function meterW(atg) { return Math.min(Math.round(atg / 50 * 100), 100); }

  function muChip(dm, gm, delta) {
    var cl, ic;
    if (delta > 2) { cl = 'do-chip-good'; ic = '&#9650;'; }
    else if (delta < -2) { cl = 'do-chip-bad'; ic = '&#9660;'; }
    else { cl = 'do-chip-neutral'; ic = '&#8594;'; }
    return '<span class="do-nhlatg-chip ' + cl + '">Matchup: ' + ic + ' ' + (delta > 0 ? '+' : '') + delta.toFixed(1) + 'pp (D&times;' + dm.toFixed(2) + ', G&times;' + gm.toFixed(2) + ')</span>';
  }

  function buildGamePills(games) {
    var h = '<button class="do-nhlatg-gamecard do-gc-active" data-gamefilter="all"><span style="color:#EDF1F7!important;font-weight:600!important;">All Games</span></button>';
    games.forEach(function(g) {
      var a = g.away, ho = g.home;
      var ac = TEAM_COLORS[a] || '#21395C', hc = TEAM_COLORS[ho] || '#21395C';
      var label = a + '-' + ho;
      h += '<button class="do-nhlatg-gamecard" data-gamefilter="' + label + '">';
      h += '<div class="do-nhlatg-gc-teams"><span class="do-nhlatg-teamchip" style="background:' + ac + ';">' + a + '</span> ';
      h += '<span class="do-nhlatg-gc-at">@</span> ';
      h += '<span class="do-nhlatg-teamchip" style="background:' + hc + ';">' + ho + '</span></div></button>';
    });
    return h;
  }

  function buildRow(idx, p, killerSet, totals, gameLabels) {
    var pos = POS_MAP[p.p] || p.p;
    var game = gameLabels[p.t] || '';
    var tc = TEAM_COLORS[p.t] || '#21395C';
    var oc = TEAM_COLORS[p.opp] || '#21395C';
    var vsat = p.t === (DATA.games.find(function(g){ return g.away === p.t; }) || {}).away ? '@' : 'vs';
    var ou = totals[game] || 5.5;
    var isHt = ou >= 6.0 ? 1 : 0;
    var isEasy = p.delta > 2 ? 1 : 0;
    var isKiller = killerSet.has(p.n) ? 1 : 0;
    var gpg = p.gp > 0 ? (p.g / p.gp).toFixed(2) : '0.00';
    var fo = fairStr(p.fo);
    var bfo = fairStr(p.bfo);
    var sp = p.sp || {gp:0,g:0,scored_in:0,atg:0};
    var spChip;
    if (sp.gp === 0) spChip = '<span class="do-nhlatg-chip do-chip-neutral">vs Opp: no data</span>';
    else {
      var scl = sp.atg >= 50 ? 'do-chip-good' : sp.atg >= 25 ? 'do-chip-avg' : 'do-chip-neutral';
      spChip = '<span class="do-nhlatg-chip ' + scl + '">vs Opp: ' + sp.g + 'G in ' + sp.gp + 'GP (' + sp.scored_in + '/' + sp.gp + ' ATG, ' + sp.atg + '%)</span>';
    }
    var blurb = p.n + ' carries a matchup-adjusted ' + p.adj + '% ATG probability (Fair: ' + fo + ') vs ' + p.opp + '. Base: ' + p.base + '% (' + bfo + '). ' + gpg + ' G/game, ' + p.sog + ' SOG/game across ' + p.gp + ' GP. O/U: ' + ou + '.';

    var isEv = p.ev ? 1 : 0;
    var isPP1 = (p.pp1 !== undefined) ? (p.pp1 ? 1 : 0) : ((PP1_UNITS[p.t] && PP1_UNITS[p.t].indexOf(p.n) !== -1) ? 1 : 0);
    var isOppB2B = (p.b2b !== undefined) ? (p.b2b ? 1 : 0) : (OPP_B2B_TONIGHT ? 1 : 0);
    var isHot = p.hot ? 1 : 0;
    var isDue = p.due ? 1 : 0;
    var isDtd = p.dtd ? 1 : 0;
    var modelProb = p.adj / 100;
    var edgeVal = null;
    var edgeCellHtml = '<span class="do-nhlatg-edgecol">&mdash;</span>';
    if (p.dk) {
      var bookProb = p.dk < 0 ? Math.abs(p.dk) / (Math.abs(p.dk) + 100) : 100 / (p.dk + 100);
      edgeVal = (modelProb - bookProb) * 100;
      var edgeCls = edgeVal > 0 ? ' do-edge-pos' : edgeVal < -5 ? ' do-edge-neg' : '';
      edgeCellHtml = '<span class="do-nhlatg-edgecol' + edgeCls + '">' + (edgeVal > 0 ? '+' : '') + edgeVal.toFixed(1) + '%</span>';
    }
    var edgeSortVal = (edgeVal === null) ? -9999 : edgeVal;
    return '<div class="do-nhlatg-row" data-game="' + game + '" data-pos="' + pos + '" data-hot="' + isHot + '" data-pp="' + isPP1 + '" data-easy="' + isEasy + '" data-b2b="' + isOppB2B + '" data-due="' + isDue + '" data-hightotal="' + isHt + '" data-atg="' + (p.adj/100).toFixed(6) + '" data-edgeval="' + edgeSortVal.toFixed(3) + '" data-odds="' + fo.replace('+','') + '" data-trend="0" data-killer="' + isKiller + '" data-ev="' + isEv + '" data-pname="' + p.n + '">' +
      '<button class="do-nhlatg-rowmain" data-rowtoggle="b-' + idx + '" aria-expanded="false">' +
        '<span class="do-nhlatg-rank">' + (idx+1) + '</span>' +
        '<span class="do-nhlatg-ownteam"><span class="do-nhlatg-teamchip" style="background:' + tc + ';">' + p.t + '</span></span>' +
        '<span class="do-nhlatg-postag">' + pos + '</span>' +
        '<span class="do-nhlatg-pblock">' +
          '<span class="do-nhlatg-pnamerow">' +
            '<span class="do-nhlatg-pname">' + p.n + '</span>' +
            '<span class="do-nhlatg-oppinfo"><span class="do-nhlatg-vsat">' + vsat + '</span><span class="do-nhlatg-teamchip" style="background:' + oc + ';">' + p.opp + '</span></span>' +
          '</span>' +
          '<span class="do-nhlatg-meter"><span class="do-nhlatg-meterfill" style="width:' + meterW(p.adj) + '%;"></span></span>' +
        '</span>' +
        '<span class="do-nhlatg-pval">' + p.adj + '<span class="do-nhlatg-pvalpct">%</span></span>' +
        '<span class="do-nhlatg-fairodds">' + fo + '</span>' +
        '<span class="do-nhlatg-dkodds' + (isEv ? ' do-ev-pos' : '') + '">' + (p.dk ? (p.dk > 0 ? '+' : '') + p.dk : '—') + '</span>' +
        edgeCellHtml +
        '<span class="do-nhlatg-expandtag"><span class="do-nhlatg-expandtxt">Matchup</span><span class="do-nhlatg-caret">&#9662;</span></span>' +
      '</button>' +
      '<div class="do-nhlatg-detail do-hidden" id="b-' + idx + '">' +
        '<p class="do-nhlatg-blurb">' + blurb + '</p>' +
        '<div class="do-nhlatg-matchline">' +
          '<span class="do-nhlatg-chip do-chip-neutral">Adj Fair: ' + fo + '</span>' +
          '<span class="do-nhlatg-chip do-chip-neutral">Base: ' + p.base + '% (' + bfo + ')</span>' +
          muChip(p.dm, p.gm, p.delta) +
          (isPP1 ? '<span class="do-nhlatg-chip do-chip-good">PP1</span>' : '') +
          '<span class="do-nhlatg-chip do-chip-neutral">Opp B2B: ' + (isOppB2B ? 'Yes' : 'No') + '</span>' +
          (p.og ? '<span class="do-nhlatg-chip do-chip-neutral">Opp G: ' + p.og + (p.ogc ? '' : ' (likely)') + '</span>' : '') +
          (p.pt ? '<span class="do-nhlatg-chip do-chip-neutral">New team: was ' + p.pt + '</span>' : '') +
          (isHot ? '<span class="do-nhlatg-chip do-chip-good">Hot: L10</span>' : '') +
          (isDue ? '<span class="do-nhlatg-chip do-chip-avg">Due: L10</span>' : '') +
          (isDtd ? '<span class="do-nhlatg-chip do-chip-bad">DTD: game-time decision</span>' : '') +
          (p.dk ? '<span class="do-nhlatg-chip ' + (isEv ? 'do-chip-good' : 'do-chip-neutral') + '">DK: ' + (p.dk > 0 ? '+' : '') + p.dk + '</span>' : '') +
          (p.edge ? '<span class="do-nhlatg-chip ' + (p.edge > 0 ? 'do-chip-good' : 'do-chip-bad') + '">Edge: ' + (p.edge > 0 ? '+' : '') + (typeof p.edge === 'number' ? p.edge.toFixed(1) : p.edge) + '%</span>' : '') +
          '<span class="do-nhlatg-chip ' + (isHt ? 'do-chip-good' : 'do-chip-neutral') + '">O/U: ' + ou + '</span>' +
          '<span class="do-nhlatg-chip do-chip-neutral">' + p.gp + ' GP | ' + p.g + ' G</span>' +
          '<span class="do-nhlatg-chip do-chip-neutral">SOG/G: ' + p.sog + '</span>' +
          spChip +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function buildDVPTab(players) {
    /* Determine which opponent teams are actually on tonight's slate, then pull real
       goals-against-by-position data for those teams from DVP_LEAGUE (ShotPropz/MoneyPuck),
       ranked against the full 32-team league. This does NOT feed the ATG% model above --
       it is a standalone reference tab. */
    var teamSet = {};
    players.forEach(function(p) { if (p.opp) teamSet[p.opp] = 1; });
    var posLabels = { C: 'Centers', LW: 'Left Wings', RW: 'Right Wings', D: 'Defensemen' };
    var posOrder = ['C', 'LW', 'RW', 'D'];
    var playerCount = {};
    players.forEach(function(p) {
      if (!p.opp) return;
      var pos = POS_MAP[p.p];
      var key = p.opp + '|' + pos;
      playerCount[key] = (playerCount[key] || 0) + 1;
    });
    var h = '';
    h += '<div class="do-nhlatg-dvpstrip" id="do-nhlatg-dvpstrip">';
    h += '<span class="do-nhlatg-dvplabel">Highlight Team:</span>';
    Object.keys(teamSet).sort().forEach(function(t) {
      var tc = TEAM_COLORS[t] || '#21395C';
      h += '<span class="do-nhlatg-dvpteam" data-dvpteam="' + t + '" style="background:' + tc + ';">' + t + '</span>';
    });
    h += '</div>';
    h += '<div class="do-nhlatg-dgrid" id="do-nhlatg-dgrid">';
    posOrder.forEach(function(pos) {
      var arr = Object.keys(teamSet).map(function(t) {
        var teamData = DVP_LEAGUE[t];
        if (!teamData) return null;
        return {
          team: t,
          val: teamData[pos],
          rank: DVP_RANK[pos][t],
          count: playerCount[t + '|' + pos] || 0
        };
      }).filter(function(r) { return r !== null; });
      arr.sort(function(a, b) { return b.val - a.val; });
      h += '<div class="do-nhlatg-dcol">';
      h += '<div class="do-nhlatg-dcolhdr"><span class="do-nhlatg-dcoltitle">' + posLabels[pos] + '</span>';
      h += '<div class="do-nhlatg-dcolsub"><span>#</span><span>Team</span><span>Lg Rk</span><span>GA/G</span></div></div>';
      arr.forEach(function(row, idx) {
        var tc = TEAM_COLORS[row.team] || '#21395C';
        var valColor = row.rank <= 11 ? '#34D399' : row.rank >= 22 ? '#F87171' : '#EDF1F7';
        h += '<div class="do-nhlatg-drow" data-dvprow="' + row.team + '">' +
          '<span class="do-nhlatg-drk">' + (idx + 1) + '</span>' +
          '<span class="do-nhlatg-teamchip" style="background:' + tc + ';">' + row.team + '</span>' +
          '<span class="do-nhlatg-dgp">#' + row.rank + '/32</span>' +
          '<span class="do-nhlatg-dval" style="color:' + valColor + ';">' + row.val.toFixed(2) + '</span>' +
          '</div>';
      });
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="do-nhlatg-note" style="margin-top:10px;">Data: MoneyPuck goals-against by position (via ShotPropz.com), regular season, refreshed daily. Green = top-third league rank (favorable matchup); red = bottom-third (tough matchup). The same numbers drive the matchup multiplier in the ATG% projections above.</div>';
    return h;
  }

  function render() {
    if (!DATA || !DATA.players) {
      appEl.innerHTML = '<div class="do-nhlatg-loading">No game data available.</div>';
      return;
    }

    var games = DATA.games || [];
    var totals = DATA.totals || {};
    var players = DATA.players || [];
    var killerSet = new Set(DATA.killers || []);
    var gameLabels = {};
    games.forEach(function(g) {
      var label = g.away + '-' + g.home;
      gameLabels[g.away] = label;
      gameLabels[g.home] = label;
    });

    var rowsHtml = '';
    players.forEach(function(p, idx) {
      rowsHtml += buildRow(idx, p, killerSet, totals, gameLabels);
    });

    var easyCount = players.filter(function(p){ return p.delta > 2; }).length;
    var htCount = players.filter(function(p){ var g = gameLabels[p.t]||''; return (totals[g]||0) >= 6; }).length;

    var html = '';
    /* Header */
    html += '<div class="do-nhlatg-root" id="do-nhlatg-root">';
    html += '<div class="do-nhlatg-hdr">';
    html += '<div class="do-nhlatg-hdr-top"><div class="do-nhlatg-hdr-left">';
    html += '<img src="' + LAMPLAB + '" alt="Lamp Lab" class="do-nhlatg-lamplab" />';
    html += '</div><div class="do-nhlatg-hdr-right">';
    html += '<span class="do-nhlatg-poweredby">POWERED BY:</span>';
    html += '<img src="' + LOCKUP + '" alt="RotoWire" style="height:26px!important;width:auto!important;display:block!important;" />';
    html += '</div></div>';
    html += '<h1 class="do-nhlatg-title">NHL Goalscorer Betting Model</h1>';
    html += '<p class="do-nhlatg-sub">Poisson-based goal probability from shrinkage-adjusted scoring rates.</p>';
    html += '</div>';

    /* Stat bar */
    html += '<div class="do-nhlatg-statbar">';
    html += '<div class="do-nhlatg-stat"><div class="do-nhlatg-sv">' + games.length + '</div><div class="do-nhlatg-sl">Games Tonight</div></div>';
    html += '<div class="do-nhlatg-stat"><div class="do-nhlatg-sv">' + players.length + '</div><div class="do-nhlatg-sl">Skaters on Slate</div></div>';
    html += '<div class="do-nhlatg-stat"><div class="do-nhlatg-sv">25-27</div><div class="do-nhlatg-sl">Rate Sample (2 Seasons)</div></div>';
    html += '</div>';

    /* Tabs */
    html += '<div class="do-nhlatg-tabrow">';
    html += '<button class="do-nhlatg-tab do-active" data-tab="lb">Tonight&#8217;s Board</button>';
    html += '<button class="do-nhlatg-tab" data-tab="dvp">Def vs. Position</button>';
    html += '<button class="do-nhlatg-tab" data-tab="meth">Methodology</button>';
    html += '</div>';

    /* Board panel */
    html += '<div class="do-nhlatg-panel" data-panel="lb">';
    html += '<div class="do-nhlatg-livebadge"><span class="do-nhlatg-livedot"></span> GOALIES, PAIRINGS, INJURIES &amp; DEPTH CHARTS FROM ROTOWIRE</div>';
    html += '<div class="do-nhlatg-gamestrip">' + buildGamePills(games) + '</div>';
    html += '<div class="do-nhlatg-filterstrip">';
    html += '<button class="do-nhlatg-filtbtn" data-filter="pos" data-val="C">C</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="pos" data-val="LW">LW</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="pos" data-val="RW">RW</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="pos" data-val="D">D</button>';
    html += '<span class="do-nhlatg-filtsep"></span>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="easy">Easy Matchup</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="hightotal">High Total</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="killer">History vs. Team</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="ev">+EV Only</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="hot">Hot</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="due">Due</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="b2b">Opp on B2B</button>';
    html += '<button class="do-nhlatg-filtbtn" data-filter="pp">PP1</button>';
    html += '</div>';
    html += '<div class="do-nhlatg-listhdr"><span class="lh-rank">#</span><span class="lh-team">TEAM</span><span class="lh-pos">POS</span><span class="lh-name">PLAYER</span><span class="lh-val do-nhlatg-sortcol" data-sortkey="atg" role="button" tabindex="0">ATG%<span class="do-nhlatg-sortarrow"></span></span><span class="lh-fair">FAIR</span><span class="lh-dk">DK</span><span class="lh-edge do-nhlatg-sortcol" data-sortkey="edgeval" role="button" tabindex="0">EDGE<span class="do-nhlatg-sortarrow"></span></span><span class="lh-expand"></span></div>';
    html += '<div id="do-nhlatg-board">' + rowsHtml + '</div>';
    html += '</div>';

    /* DVP panel */
    html += '<div class="do-nhlatg-panel" data-panel="dvp" style="display:none;">';
    html += '<p style="color:#8494AC;font-size:12px;line-height:1.55;margin-bottom:14px;">Real goals-against-per-game by position for tonight&#8217;s opponents, ranked against the full 32-team league (1 = allows the most, easiest matchup). Source: MoneyPuck via ShotPropz.com. This is the same data behind the matchup multiplier in the ATG% model (dampened 50% toward league average). Refreshed daily.</p>';
    html += buildDVPTab(players);
    html += '</div>';

    /* Methodology panel */
    html += '<div class="do-nhlatg-panel" data-panel="meth" style="padding:24px!important;display:none;">';
    html += '<div class="do-nhlatg-meth">';
    html += '<div class="do-nhlatg-methhdr">How the Model Works</div>';
    html += '<p>Lamp Lab is a <strong>Poisson-based goalscorer projection model</strong> that estimates each skater&#8217;s probability of scoring at least one goal tonight.</p>';
    html += '<div class="do-nhlatg-methhdr">Inputs</div>';
    html += '<p><strong>Scoring rate:</strong> Goals and expected goals per game, blended between last season (2025-26) and this season (2026-27) by how many games each player has played this year: 0% this season until 10 games, 50% at 10, 60% at 15, 80% at 20 and 100% from 25. The blended rate is then shrinkage-adjusted toward a positional prior so small-sample players (rookies, injury-return) aren&#8217;t wildly over- or under-projected.</p>';
    html += '<p><strong>Matchup multiplier (50% dampening):</strong> How the opposing defense allows goals vs. league average, blended with the skater&#8217;s own team&#8217;s offensive environment. The multiplier is dampened 50% toward 1.0 to avoid overfitting noisy defensive splits.</p>';
    html += '<p><strong>Game total:</strong> The sportsbook over/under for tonight&#8217;s game, used as a proxy for expected goal environment.</p>';
    html += '<div class="do-nhlatg-methhdr">Calculation</div>';
    html += '<p>The model converts the adjusted scoring rate into a Poisson lambda, then computes <strong>P(goals &ge; 1) = 1 &minus; e<sup>&minus;&lambda;</sup></strong>. This is the ATG% shown for each player.</p>';
    html += '<div class="do-nhlatg-methhdr">Fair Odds</div>';
    html += '<p>ATG% is converted to American odds. If a sportsbook prices a player&#8217;s anytime goal scorer line worse than the model&#8217;s fair price, that player is flagged as <strong>+EV</strong> (positive expected value). Edge = model implied probability minus book implied probability.</p>';
    html += '<div class="do-nhlatg-methhdr">What the Model Does NOT Do</div>';
    html += '<p>The matchup details (line placement, power-play role, goalie quality, back-to-back status) are shown as <strong>context chips</strong> but are <em>not</em> baked into the ATG number. Use them to apply your own judgment on top of the model output.</p>';
    html += '<p><strong>Hot:</strong> Scored 4+ goals over the last 10 games AND that L10 rate is at least 1.4x the player&#8217;s full-season goals/game rate. Small-sample flag &#8212; not baked into ATG% above.</p>';
    html += '<p><strong>Due:</strong> Expected goals (xG) over the last 10 games exceeded actual goals scored by 2.0+ &#8212; a regression-to-the-mean signal, not a prediction. Not baked into ATG% above.</p>';
    html += '<div class="do-nhlatg-note">Data: MoneyPuck (scoring rates, L10 game logs), NHL Stats API (matchup splits), RotoWire (lineups, injuries). Odds: DraftKings via Optic Odds API.</div>';
    html += '</div></div>';

    /* Footer */
    html += '<div class="do-nhlatg-foot">';
    html += '<span class="do-nhlatg-foot-txt">Data: MoneyPuck, NHL API, RotoWire. Model: RotoWire Research. Updated: ' + (DATA.date || 'N/A') + '</span>';
    html += '<img src="' + LOCKUP + '" style="height:16px;width:auto;display:block;" alt="RotoWire" />';
    html += '</div>';
    html += '</div>';

    appEl.innerHTML = html;
    initInteractions();
  }

  /* ─── INTERACTIONS ────────────────────────────── */
  function initInteractions() {
    var root = document.getElementById('do-nhlatg-root');
    if (!root) return;

    /* Row expand/collapse */
    root.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-rowtoggle]');
      if (btn) {
        var id = btn.getAttribute('data-rowtoggle');
        var det = document.getElementById(id);
        if (det) {
          det.classList.toggle('do-hidden');
          btn.setAttribute('aria-expanded', det.classList.contains('do-hidden') ? 'false' : 'true');
        }
        return;
      }

      /* Game filter */
      var gc = e.target.closest('[data-gamefilter]');
      if (gc) {
        var val = gc.getAttribute('data-gamefilter');
        root.querySelectorAll('.do-nhlatg-gamecard').forEach(function(b){ b.classList.remove('do-gc-active'); });
        gc.classList.add('do-gc-active');
        root.querySelectorAll('.do-nhlatg-row').forEach(function(r){
          r.style.display = (val === 'all' || r.getAttribute('data-game') === val) ? '' : 'none';
        });
        return;
      }

      /* Column sort (e.g. Edge) */
      var sortHdr = e.target.closest('[data-sortkey]');
      if (sortHdr) {
        var key = sortHdr.getAttribute('data-sortkey');
        var board = document.getElementById('do-nhlatg-board');
        if (board) {
          var goingDesc = !sortHdr.classList.contains('do-sort-desc');
          root.querySelectorAll('.do-nhlatg-sortcol').forEach(function(h){ h.classList.remove('do-sort-asc','do-sort-desc'); });
          sortHdr.classList.add(goingDesc ? 'do-sort-desc' : 'do-sort-asc');
          var rows = Array.prototype.slice.call(board.querySelectorAll('.do-nhlatg-row'));
          rows.sort(function(a, b) {
            var av = parseFloat(a.getAttribute('data-' + key)) || 0;
            var bv = parseFloat(b.getAttribute('data-' + key)) || 0;
            return goingDesc ? (bv - av) : (av - bv);
          });
          rows.forEach(function(r, i) {
            board.appendChild(r);
            var rankSpan = r.querySelector('.do-nhlatg-rank');
            if (rankSpan) rankSpan.textContent = (i + 1);
          });
        }
        return;
      }

      /* Filter pills */
      var fb = e.target.closest('[data-filter]');
      if (fb) {
        var filter = fb.getAttribute('data-filter');
        var filterVal = fb.getAttribute('data-val');
        var isActive = fb.classList.contains('do-filt-on');
        
        /* Deactivate all filters in same group */
        if (filter === 'pos') {
          root.querySelectorAll('[data-filter="pos"]').forEach(function(b){ b.classList.remove('do-filt-on'); });
        } else {
          root.querySelectorAll('[data-filter]:not([data-filter="pos"])').forEach(function(b){ b.classList.remove('do-filt-on'); });
          if (!isActive) fb.classList.add('do-filt-on');
          isActive = !isActive;
        }
        
        if (filter === 'pos' && !isActive) {
          fb.classList.add('do-filt-on');
          root.querySelectorAll('.do-nhlatg-row').forEach(function(r){
            r.style.display = r.getAttribute('data-pos') === filterVal ? '' : 'none';
          });
        } else if (filter === 'pos') {
          root.querySelectorAll('.do-nhlatg-row').forEach(function(r){ r.style.display = ''; });
        } else if (!isActive) {
          root.querySelectorAll('.do-nhlatg-row').forEach(function(r){ r.style.display = ''; });
        } else {
          var attr = 'data-' + filter;
          root.querySelectorAll('.do-nhlatg-row').forEach(function(r){
            r.style.display = r.getAttribute(attr) === '1' ? '' : 'none';
          });
        }
        return;
      }

      /* DVP team filter */
      var dvpChip = e.target.closest('[data-dvpteam]');
      if (dvpChip) {
        var dvpTeam = dvpChip.getAttribute('data-dvpteam');
        var dgrid = document.getElementById('do-nhlatg-dgrid');
        var wasActive = dvpChip.classList.contains('do-dvp-active');
        root.querySelectorAll('.do-nhlatg-dvpteam').forEach(function(c){ c.classList.remove('do-dvp-active'); });
        root.querySelectorAll('.do-nhlatg-drow').forEach(function(r){ r.classList.remove('do-dvp-hl'); });
        if (!wasActive) {
          dvpChip.classList.add('do-dvp-active');
          if (dgrid) dgrid.classList.add('do-dvp-filtering');
          root.querySelectorAll('.do-nhlatg-drow[data-dvprow="' + dvpTeam + '"]').forEach(function(r){ r.classList.add('do-dvp-hl'); });
        } else {
          if (dgrid) dgrid.classList.remove('do-dvp-filtering');
        }
        return;
      }

      /* Tab switching */
      var tab = e.target.closest('[data-tab]');
      if (tab) {
        var panel = tab.getAttribute('data-tab');
        root.querySelectorAll('.do-nhlatg-tab').forEach(function(t){ t.classList.remove('do-active'); });
        tab.classList.add('do-active');
        root.querySelectorAll('.do-nhlatg-panel').forEach(function(p){
          p.style.display = p.getAttribute('data-panel') === panel ? '' : 'none';
        });
      }
    });
  }

  /* ─── INIT ────────────────────────────────────── */
  async function init() {
    await loadData();
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

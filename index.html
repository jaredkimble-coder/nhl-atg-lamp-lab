  var sub = document.getElementById('sub-line');
  var d = new Date(SEED_DATA.updatedAt);
  sub.textContent = SEED_DATA.date + ' \u00b7 last refreshed ' + d.toUTCString();

  var statbar = document.getElementById('statbar');
  statbar.innerHTML =
    '<div class="stat"><div class="v">' + (SEED_DATA.games || []).length + '</div><div class="l">Games</div></div>' +
    '<div class="stat"><div class="v">' + players.length + '</div><div class="l">Priced Skaters</div></div>';

  var content = document.getElementById('content');
  if (players.length === 0) {
    content.innerHTML = '<div class="empty">No live-priced players right now. Check back closer to puck drop.</div>';
    return;
  }

  var rows = players.map(function(p) {
    var edgeClass = (p.edge || 0) > 0 ? 'edge-pos' : 'edge-neg';
    return '<tr>' +
      '<td class="name">' + p.n + '<div class="dim">' + p.t + ' vs ' + p.opp + '</div></td>' +
      '<td class="num">' + p.adj + '%</td>' +
      '<td class="num">' + fairStr(p.fo) + '</td>' +
      '<td class="num">' + fairStr(p.dk) + '</td>' +
      '<td class="num ' + edgeClass + '">' + (p.edge > 0 ? '+' : '') + p.edge + '%</td>' +
      '</tr>';
  }).join('');

  content.innerHTML =
    '<table><thead><tr>' +
    '<th data-k="n">Player</th>' +
    '<th data-k="adj">ATG%</th>' +
    '<th data-k="fo">Fair</th>' +
    '<th data-k="dk">DK</th>' +
    '<th data-k="edge">Edge</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';

  var ths = content.querySelectorAll('th');
  for (var i = 0; i < ths.length; i++) {
    ths[i].addEventListener('click', function() {
      var k = this.getAttribute('data-k');
      if (sortKey === k) { sortDir = -sortDir; } else { sortKey = k; sortDir = -1; }
      render();
    });
  }
}

render();
</script>

</body>
</html>
